<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO アプリ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="new-todo" type="text" placeholder="新しいタスクを入力..." aria-label="新しいタスク" autofocus>
      <button type="submit">追加</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty" class="empty">タスクはまだありません。上のフォームから追加してください。</p>

    <footer class="footer" hidden>
      <span id="count" class="count"></span>
      <div class="filters" role="tablist" aria-label="フィルター">
        <button type="button" data-filter="all" class="filter active">すべて</button>
        <button type="button" data-filter="active" class="filter">未完了</button>
        <button type="button" data-filter="completed" class="filter">完了</button>
      </div>
      <button id="clear-completed" type="button" class="clear">完了済みを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
